<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Social Media Support Agent — Supervisor Suite v4.5</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-12">
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <div class="max-w-7xl mx-auto p-6">
    <div class="flex flex-wrap items-center justify-between border-b border-slate-800 pb-5 mb-6 gap-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
          Social Media Support Agent <span class="text-xs font-mono bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-full">PRO v4.5</span>
        </h1>
        <p class="text-slate-400 text-sm mt-1">Autonomous Multi-Account Control Center</p>
      </div>
      <div class="flex bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
        <button id="tabDeployBtn" onclick="switchTab('deploy')" class="px-5 py-2.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white shadow-lg transition">🚀 Deploy & Feed</button>
        <button id="tabAccountsBtn" onclick="switchTab('accounts')" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition flex items-center gap-2"><span>👥 Agent Roster</span><span id="rosterBadge" class="bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full text-[11px] font-mono">0 Armed</span></button>
      </div>
    </div>

    <!-- TAB 1 -->
    <div id="tabDeploy" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <div class="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl h-fit space-y-4">
        <h2 class="text-lg font-semibold text-white">⚡ Dispatch Support Agent</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Select Agent & Linked Account</label>
            <select id="agent_id" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm text-white font-medium focus:outline-none focus:border-indigo-500"></select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Target Facebook Post / Reel URL</label>
            <input id="post_url" type="text" value="https://www.facebook.com/reel/2062417224438860/" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white font-mono focus:outline-none focus:border-indigo-500" />
          </div>
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-xs font-medium text-slate-400">Post Context / Direction for AI</label>
              <button onclick="previewComment()" class="text-[11px] bg-indigo-500/10 text-indigo-300 hover:bg-indigo-500/20 px-2.5 py-1 rounded-lg border border-indigo-500/30 transition">✨ Preview AI Comment</button>
            </div>
            <textarea id="post_text" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-white focus:outline-none focus:border-indigo-500">its just a local breaking news make it sound alerting</textarea>
            
            <div id="previewBox" class="hidden mt-2 bg-slate-950 border border-emerald-500/30 rounded-xl p-3 text-xs text-emerald-300 font-medium space-y-2">
              <div id="previewText"></div>
              <div class="flex justify-end border-t border-slate-800 pt-2">
                <button onclick="previewComment()" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-indigo-300 px-2.5 py-1 rounded-md">🔄 Regenerate Variation</button>
              </div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Persona</label>
              <select id="persona" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white">
                <option value="Community Watcher">Community Watcher</option>
                <option value="Support Specialist">Support Specialist</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Tone</label>
              <select id="tone" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white">
                <option value="Urgent & Alerting">Urgent & Alerting</option>
                <option value="Warm & Helpful">Warm & Helpful</option>
              </select>
            </div>
          </div>
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
            <div class="flex items-center justify-between text-xs text-slate-200">
              <label class="flex items-center gap-2 cursor-pointer"><input id="do_like" type="checkbox" checked class="accent-indigo-500 w-4 h-4 rounded" /><span>👍 Auto-Like</span></label>
              <label class="flex items-center gap-2 cursor-pointer"><input id="do_comment" type="checkbox" checked class="accent-indigo-500 w-4 h-4 rounded" /><span>💬 Auto-Comment</span></label>
            </div>
          </div>
          <div class="space-y-2.5">
            <button id="deployBtn" onclick="deployAgent(false)" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-xl shadow-xl transition cursor-pointer">🚀 Like, Comment & Capture Proof</button>
            <button onclick="deployAgent(true)" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold py-3 rounded-xl transition cursor-pointer">🐝 Swarm Mode: Dispatch All 3 Agents</button>
          </div>
        </div>
      </div>

      <div class="lg:col-span-7 space-y-4">
        <h2 class="text-lg font-semibold text-white">📡 Live Agent Execution Feed</h2>
        <div id="jobsContainer" class="space-y-4">
          <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-10 text-center text-slate-500 text-sm">Ready for deployment.</div>
        </div>
      </div>
    </div>

    <!-- TAB 2 -->
    <div id="tabAccounts" class="hidden space-y-6">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <h2 class="text-lg font-semibold text-white">👥 Agent Roster & Cookie Vault</h2>
        <p class="text-xs text-slate-400 mt-1 mb-6">Paste Cookie-Editor JSON array. Account name is automatically fetched from your <code class="text-emerald-300">c_user</code> cookie.</p>
        <div id="accountsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-5"></div>
      </div>
    </div>
  </div>

  <script>
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `border ${type === 'success' ? 'border-emerald-500/40 bg-emerald-950 text-emerald-200' : 'border-indigo-500/40 bg-indigo-950 text-indigo-200'} px-4 py-3 rounded-xl shadow-2xl text-xs font-medium`;
      toast.innerHTML = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function switchTab(tab) {
      const isDeploy = tab === 'deploy';
      document.getElementById('tabDeploy').classList.toggle('hidden', !isDeploy);
      document.getElementById('tabAccounts').classList.toggle('hidden', isDeploy);
      document.getElementById('tabDeployBtn').className = isDeploy ? 'px-5 py-2.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white shadow-lg transition' : 'px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition';
      document.getElementById('tabAccountsBtn').className = !isDeploy ? 'px-5 py-2.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white shadow-lg transition flex items-center gap-2' : 'px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition flex items-center gap-2';
      if (!isDeploy) loadAccounts();
    }

    async function previewComment() {
      const box = document.getElementById('previewBox');
      const textEl = document.getElementById('previewText');
      box.classList.remove('hidden');
      textEl.innerText = '⏳ Generating AI preview...';
      const res = await fetch('/api/preview', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          agent_id: document.getElementById('agent_id').value,
          post_url: document.getElementById('post_url').value,
          post_text: document.getElementById('post_text').value,
          persona: document.getElementById('persona').value,
          tone: document.getElementById('tone').value
        })
      });
      const data = await res.json();
      textEl.innerText = '💬 Preview: "' + (data.comment || '') + '"';
      showToast('AI preview ready!', 'success');
    }

    async function loadAccounts() {
      const res = await fetch('/api/accounts');
      const accounts = await res.json();
      const select = document.getElementById('agent_id');
      const currentVal = select.value;
      const entries = Object.values(accounts);
      document.getElementById('rosterBadge').innerText = `${entries.filter(a => a.cookie_count > 0).length}/${entries.length} Armed`;
      select.innerHTML = entries.map(a => `<option value="${a.agent_id}">${a.agent_id} ➔ ${a.account_name} (${a.cookie_count > 0 ? a.cookie_count + ' cookies' : 'Sandbox'})</option>`).join('');
      if (currentVal) select.value = currentVal;
      
      document.getElementById('accountsGrid').innerHTML = entries.map(a => `
        <div class="bg-slate-950 border ${a.cookie_count > 0 ? 'border-emerald-500/40' : 'border-slate-800'} rounded-2xl p-5 flex flex-col justify-between space-y-4">
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <span class="font-mono text-xs bg-indigo-500/20 text-indigo-300 px-2.5 py-1 rounded-md">${a.agent_id}</span>
              <span class="text-xs font-mono px-2.5 py-0.5 rounded-full ${a.cookie_count > 0 ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-400'}">${a.cookie_count > 0 ? a.cookie_count + ' Cookies' : 'Unlinked'}</span>
            </div>
            <div>
              <label class="block text-[11px] font-mono text-slate-400 mb-1">Account Name (Auto-Derived)</label>
              <input id="name_${a.agent_id}" type="text" value="${a.account_name || ''}" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white" />
            </div>
            <div class="text-xs font-mono bg-slate-900 p-2.5 rounded-xl border border-slate-800 text-emerald-300">
              <div>USER ID: ${a.fb_uid}</div>
            </div>
            <div>
              <label class="block text-[11px] font-mono text-slate-400 mb-1">Cookie JSON:</label>
              <textarea id="cookies_${a.agent_id}" rows="4" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs font-mono text-emerald-300" placeholder='Paste Cookie-Editor JSON...'>${a.cookies && a.cookies.length ? JSON.stringify(a.cookies, null, 2) : ''}</textarea>
            </div>
          </div>
          <button onclick="saveAccount('${a.agent_id}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-3 rounded-xl transition cursor-pointer">💾 Save Account & Cookies</button>
        </div>
      `).join('');
    }

    async function saveAccount(agentId) {
      const res = await fetch('/api/accounts', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          agent_id: agentId,
          account_name: document.getElementById(`name_${agentId}`).value,
          cookies_raw: document.getElementById(`cookies_${agentId}`).value
        })
      });
      const data = await res.json();
      showToast(data.message, data.ok ? 'success' : 'error');
      loadAccounts();
    }

    async function deployAgent(swarmMode = false) {
      const btn = document.getElementById('deployBtn');
      btn.disabled = true;
      btn.innerHTML = '⏳ Running...';
      try {
        const res = await fetch(swarmMode ? '/api/dispatch-swarm' : '/api/dispatch', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            agent_id: document.getElementById('agent_id').value,
            post_url: document.getElementById('post_url').value,
            post_text: document.getElementById('post_text').value,
            persona: document.getElementById('persona').value,
            tone: document.getElementById('tone').value,
            do_like: document.getElementById('do_like').checked,
            do_comment: document.getElementById('do_comment').checked
          })
        });
        const data = await res.json();
        showToast(data.message, 'success');
        loadJobs();
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🚀 Like, Comment & Capture Proof';
      }
    }

    async function loadJobs() {
      const res = await fetch('/api/jobs');
      const jobs = await res.json();
      const container = document.getElementById('jobsContainer');
      if (!jobs || !jobs.length) {
        container.innerHTML = '<div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-10 text-center text-slate-500 text-sm">No deployment records found.</div>';
        return;
      }
      container.innerHTML = jobs.map(j => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
          <div class="flex justify-between items-center text-xs">
            <span class="font-mono bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded">${j.agent_id} ➔ ${j.account_name}</span>
            <span class="font-mono text-emerald-300">${j.status}</span>
          </div>
          <div class="bg-slate-950 p-3 rounded-xl text-sm text-emerald-300">"${j.comment}"</div>
          <div class="bg-black/70 p-3 rounded-xl font-mono text-xs text-slate-300 space-y-1">
            ${(j.logs || []).map(l => `<div>${l}</div>`).join('')}
          </div>
          ${j.screenshot ? `<img src="${j.screenshot}?t=${Date.now()}" class="rounded-xl border border-slate-700 w-full max-h-80 object-cover" />` : ''}
        </div>
      `).join('');
    }

    loadAccounts();
    loadJobs();
    setInterval(loadJobs, 3000);
  </script>
</body>
</html>
